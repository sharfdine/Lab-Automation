# Paste this into: Streamlit Cloud -> your app -> Settings -> Secrets
# (for running on your own PC, save it as .streamlit\secrets.toml next to app.py)
# NEVER upload this file with real values to GitHub.

# Supabase -> Connect -> "Session pooler" string, with YOUR real password in place of [YOUR-PASSWORD]
DATABASE_URL = "postgresql://postgres.xxxxxxxx:YOUR-REAL-PASSWORD@aws-1-xx-region.pooler.supabase.com:5432/postgres"

# OPTIONAL: remove the # below to lock the app behind a password
# APP_PASSWORD = "choose-a-strong-password"
